<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RAG from scratch: chat</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 820px; margin: 2rem auto; padding: 0 1rem; color: #1f2933; }
        h1 { font-size: 1.4rem; }
        form { display: flex; gap: .5rem; }
        input[type=text] { flex: 1; padding: .6rem; font-size: 1rem; border: 1px solid #cbd2d9; border-radius: 6px; }
        button, select { padding: .6rem 1rem; font-size: 1rem; border-radius: 6px; border: 1px solid #cbd2d9; }
        button { background: #2563eb; color: white; border: none; cursor: pointer; }
        button:disabled { background: #93b4f5; }
        .turn { margin-top: 1.5rem; }
        .q { font-weight: 600; }
        .a { white-space: pre-wrap; line-height: 1.5; margin-top: .4rem; }
        .sources { font-size: .85rem; color: #52606d; margin-top: .5rem; }
    </style>
</head>
<body>
    <h1>Ask your documents</h1>
    <form id="f">
        <input id="q" type="text" placeholder="e.g. Where is the European Court of Human Rights based?" autofocus>
        <select id="mode">
            <option value="vector">vector</option>
            <option value="hybrid">hybrid</option>
            <option value="rerank">hybrid + rerank</option>
        </select>
        <button id="go">Ask</button>
    </form>
    <div id="log"></div>

<script>
const form = document.getElementById('f'), log = document.getElementById('log'), go = document.getElementById('go');

form.addEventListener('submit', async e => {
    e.preventDefault();
    const question = document.getElementById('q').value.trim();
    if (!question) return;
    go.disabled = true;

    const turn = document.createElement('div'); turn.className = 'turn';
    turn.innerHTML = '<div class="q"></div><div class="a">Searching...</div><div class="sources"></div>';
    turn.querySelector('.q').textContent = question;
    log.prepend(turn);
    const answer = turn.querySelector('.a'), sources = turn.querySelector('.sources');

    try {
        const res = await fetch('/api/ask', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ question, mode: document.getElementById('mode').value })
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const reader = res.body.getReader(), decoder = new TextDecoder();
        let buffer = '', gotSources = false;
        while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            buffer += decoder.decode(value, { stream: true });
            if (!gotSources) {                       // first line = JSON list of sources
                const nl = buffer.indexOf('\n');
                if (nl < 0) continue;
                sources.textContent = JSON.parse(buffer.slice(0, nl)).join(' · ');
                buffer = buffer.slice(nl + 1); gotSources = true; answer.textContent = '';
            }
            answer.textContent += buffer; buffer = '';
        }
    } catch (err) {
        answer.textContent = 'Error: ' + err.message;
    } finally {
        go.disabled = false;
    }
});
</script>
</body>
</html>
